<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .error-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h1 { font-size: 64px; color: #e74c3c; margin-bottom: 10px; }
        h2 { font-size: 20px; color: #333; margin-bottom: 20px; }
        p { color: #666; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #4f46e5; color: white; text-decoration: none; border-radius: 6px; font-size: 16px; font-weight: 500; transition: 0.2s; }
        .btn:hover { background-color: #4338ca; }
    </style>
</head>
<body>

<div class="error-card">
    <h1>Упс!</h1>
    <h2>Что-то пошло не так</h2>
    <p>Запрашиваемая страница не найдена или произошла ошибка на сервере.</p>
    <!-- Ссылка на главную страницу (ваш landing) -->
    <a href="/" class="btn">На главную</a>
</div>

</body>
</html>
