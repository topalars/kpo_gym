<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h1 { font-size: 24px; color: #333; margin-bottom: 10px; text-align: center; }
        p.subtitle { text-align: center; color: #777; font-size: 14px; margin-bottom: 30px; }
        .menu-item { display: block; padding: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 10px; text-decoration: none; color: #333; font-weight: 500; transition: 0.2s; }
        .menu-item:hover { background: #eef2ff; border-color: #c7d2fe; color: #4f46e5; }
        .logout { display: block; text-align: center; margin-top: 25px; font-size: 14px; color: #e74c3c; text-decoration: none; }
        .logout:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="admin-card">
    <h1>👑 Панель администратора</h1>
    <p class="subtitle">Добро пожаловать! У вас есть права администратора.</p>

    <!-- Просто примеры кнопок для навигации (ссылки пока никуда не ведут) -->
    <a href="#" class="menu-item">👥 Управление пользователями</a>
    <a href="#" class="menu-item">📊 Статистика системы</a>
    <a href="#" class="menu-item">⚙️ Настройки приложения</a>

    <a href="/logout" class="logout">Выйти из аккаунта</a>
</div>

</body>
</html>
