server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: FitLife
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitlife}
    username: ${DB_USER:fitlife}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
fitlife:
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
